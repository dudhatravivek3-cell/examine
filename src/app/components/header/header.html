<header [class.scrolled]="isScrolled()" class="main-header glass animate-fadeIn">
  <div class="container flex-between">
    <!-- Logo -->
    <a routerLink="/" class="logo flex" (click)="closeMenu()">
      <i class="fa-solid fa-globe logo-globe" style="color: var(--secondary-color);"></i>
      <div class="logo-text">
        <span class="brand-name">Examine</span>
        <span class="brand-sub">EXPORT SERVICES</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-desktop">
      <ul class="nav-list flex">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
        <li><a routerLink="/about" routerLinkActive="active">About Us</a></li>
        <li><a routerLink="/products" routerLinkActive="active">Products</a></li>
        <li><a routerLink="/infrastructure" routerLinkActive="active">Infrastructure</a></li>
        <li><a routerLink="/certifications" routerLinkActive="active">Certifications</a></li>
        <li><a routerLink="/gallery" routerLinkActive="active">Gallery</a></li>
        <li><a routerLink="/blog" routerLinkActive="active">Blog</a></li>
        <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
        <li><a routerLink="/admin/dashboard" routerLinkActive="active" class="admin-badge">Admin</a></li>
      </ul>
    </nav>

    <!-- Mobile Navigation Toggle -->
    <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Navigation Menu -->
  <div class="nav-mobile" [class.show]="isMenuOpen()">
    <ul class="mobile-nav-list flex-column">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a></li>
      <li><a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a></li>
      <li><a routerLink="/infrastructure" routerLinkActive="active" (click)="closeMenu()">Infrastructure</a></li>
      <li><a routerLink="/certifications" routerLinkActive="active" (click)="closeMenu()">Certifications</a></li>
      <li><a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a></li>
      <li><a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">Blog</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      <li><a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeMenu()" class="admin-badge">Admin Dashboard</a></li>
    </ul>
  </div>
</header>
